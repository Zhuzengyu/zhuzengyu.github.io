<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器状态 | 方块世界</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .status-page {
            padding-top: 100px;
            min-height: 100vh;
            background: linear-gradient(rgba(245,245,245,0.9), rgba(245,245,245,0.9));
        }
        
        .current-status {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .refresh-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .detail-item {
            padding: 15px;
            background: var(--bg);
            border-radius: var(--radius);
        }
        
        .detail-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 20px;
            font-weight: 600;
        }
        
        .status-history {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        
        .log-list {
            margin-top: 20px;
        }
        
        .log-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .log-item:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: var(--text-light);
            font-size: 14px;
        }
        
        .log-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-online-badge {
            background: #4CAF50;
            color: white;
        }
        
        .status-offline-badge {
            background: #f44336;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: var(--text-light);
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .status-details {
                grid-template-columns: 1fr;
            }
            
            .status-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header id="main-header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <i class="fas fa-cube"></i> 方块<span>世界</span>
                </a>
                <ul class="nav-links" id="navLinks">
                    <li><a href="index.html">返回主页</a></li>
                    <li><a href="#current">当前状态</a></li>
                    <li><a href="#history">历史记录</a></li>
                    <li><a href="#stats">统计信息</a></li>
                </ul>
                <div class="mobile-menu" id="mobileMenu">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="status-page">
        <div class="container">
            <!-- 当前状态 -->
            <section id="current" class="current-status">
                <div class="status-header">
                    <h2>当前服务器状态</h2>
                    <button class="refresh-btn" onclick="refreshStatus()">
                        <i class="fas fa-sync-alt"></i> 刷新状态
                    </button>
                </div>
                
                <div class="status-details">
                    <div class="detail-item">
                        <div class="detail-label">服务器IP</div>
                        <div class="detail-value">mc.zzy10.top</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">运行状态</div>
                        <div class="detail-value">
                            <span id="currentStatus" class="status-online">在线</span>
                        </div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">在线玩家</div>
                        <div class="detail-value" id="currentPlayers">12/100</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">服务器版本</div>
                        <div class="detail-value" id="serverVersion">1.20.1</div>
                    </div>
                    
                    <div class="detail-item">
                        <div class="detail-label">最后检测</div>
                        <div class="detail-value" id="lastCheck">刚刚</div>
                    </div>
                </div>
            </section>

            <!-- 统计信息 -->
            <section id="stats" class="status-history">
                <h2>服务器统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="uptimePercent">95%</div>
                        <div class="stat-label">今日在线率</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-value" id="avgPlayers">15</div>
                        <div class="stat-label">平均在线玩家</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-value" id="totalChecks">128</div>
                        <div class="stat-label">总检测次数</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-value" id="maxPlayers">42</div>
                        <div class="stat-label">最高在线记录</div>
                    </div>
                </div>
            </section>

            <!-- 状态历史 -->
            <section id="history" class="status-history">
                <h2>状态记录</h2>
                <div class="log-list" id="statusLogs">
                    <!-- 记录会通过JS动态添加 -->
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn" onclick="clearHistory()">
                        <i class="fas fa-trash"></i> 清除记录
                    </button>
                </div>
            </section>
        </div>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-column">
                    <h3>方块世界</h3>
                    <p>实时监控服务器运行状态</p>
                </div>
                <div class="footer-column">
                    <h3>快速链接</h3>
                    <ul class="footer-links">
                        <li><a href="index.html">返回主页</a></li>
                        <li><a href="#current">当前状态</a></li>
                        <li><a href="#stats">统计信息</a></li>
                        <li><a href="#history">历史记录</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h3>其他页面</h3>
                    <ul class="footer-links">
                        <li><a href="rules.html">服务器规则</a></li>
                        <li><a href="friend-links.html">友情链接</a></li>
                        <li><a href="github-issue.html">问题反馈</a></li>
                    </ul>
                </div>
            </div>
            <div class="copyright">
                <p>&copy; 2024 方块世界 Minecraft服务器</p>
            </div>
        </div>
    </footer>

    <script>
        // 移动端菜单
        document.getElementById('mobileMenu').addEventListener('click', function() {
            document.getElementById('navLinks').classList.toggle('active');
        });
        
        // 服务器状态检测
        async function checkServerStatus() {
            const statusEl = document.getElementById('currentStatus');
            const playersEl = document.getElementById('currentPlayers');
            const versionEl = document.getElementById('serverVersion');
            const lastCheckEl = document.getElementById('lastCheck');
            
            // 显示加载状态
            statusEl.textContent = '检测中...';
            statusEl.className = '';
            
            try {
                const response = await fetch('https://api.mcsrvstat.us/2/mc.zzy10.top');
                const data = await response.json();
                
                // 更新显示
                if (data.online) {
                    statusEl.textContent = '在线';
                    statusEl.className = 'status-online';
                    playersEl.textContent = (data.players?.online || 0) + '/100';
                    versionEl.textContent = data.version || '1.20.1';
                } else {
                    statusEl.textContent = '离线';
                    statusEl.className = 'status-offline';
                    playersEl.textContent = '0/100';
                    versionEl.textContent = '未知';
                }
                
                // 更新时间
                const now = new Date();
                lastCheckEl.textContent = now.toLocaleTimeString();
                
                // 记录到历史
                addStatusLog(data.online, data.players?.online || 0);
                
            } catch (error) {
                statusEl.textContent = '检测失败';
                statusEl.className = 'status-offline';
                lastCheckEl.textContent = new Date().toLocaleTimeString();
            }
        }
        
        // 添加状态记录
        function addStatusLog(isOnline, playerCount) {
            const logList = document.getElementById('statusLogs');
            const time = new Date().toLocaleTimeString();
            
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerHTML = `
                <div>
                    <strong>${time}</strong>
                    <div style="font-size: 12px; color: #666; margin-top: 4px;">
                        玩家: ${playerCount}/100
                    </div>
                </div>
                <span class="log-status ${isOnline ? 'status-online-badge' : 'status-offline-badge'}">
                    ${isOnline ? '在线' : '离线'}
                </span>
            `;
            
            // 添加到列表顶部
            logList.insertBefore(logItem, logList.firstChild);
            
            // 限制记录数量
            const items = logList.querySelectorAll('.log-item');
            if (items.length > 20) {
                logList.removeChild(items[items.length - 1]);
            }
        }
        
        // 刷新状态
        function refreshStatus() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中';
            btn.disabled = true;
            
            checkServerStatus().finally(() => {
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> 刷新状态';
                    btn.disabled = false;
                }, 1000);
            });
        }
        
        // 清除历史记录
        function clearHistory() {
            if (confirm('确定要清除所有状态记录吗？')) {
                document.getElementById('statusLogs').innerHTML = '';
            }
        }
        
        // 模拟统计数据
        function updateStats() {
            // 这些是模拟数据，实际应用中应该从服务器获取
            document.getElementById('uptimePercent').textContent = '95%';
            document.getElementById('avgPlayers').textContent = '15';
            document.getElementById('totalChecks').textContent = '128';
            document.getElementById('maxPlayers').textContent = '42';
        }
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            checkServerStatus();
            updateStats();
            
            // 每30秒自动刷新一次
            setInterval(checkServerStatus, 30000);
        });
    </script>
</body>
</html>
